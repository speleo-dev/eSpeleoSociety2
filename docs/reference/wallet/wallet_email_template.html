<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Váš Preukaz je Pripravený!</title>
    <style>
        body {
            font-family: Arial, sans-serif; /* Escaped curly braces */
            line-height: 1.6;
            color: #333333; /* Escaped curly braces */
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #dddddd;
            border-radius: 5px;
            background-color: #ffffff; /* Escaped curly braces */
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #4285F4; /* Google Blue */
            color: #ffffff; /* Escaped curly braces */
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold; /* Escaped curly braces */
        }
        .footer {
            margin-top: 30px;
            font-size: 0.8em;
            color: #777777;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Dobrý deň $member_name!</h2>
        <p>Váš preukaz je pripravený na pridanie do Peňaženky Google.</p>
        <p>Kliknite na tlačidlo nižšie, aby ste ho pridali:</p>
        <a href="$jwt_link" class="button"><img src="https://storage.googleapis.com/sss_sk_bucket/sk_add_to_google_wallet_add-wallet-badge.png"></a>
        <p style="margin-top: 20px;">Ak tlačidlo nefunguje, skopírujte a vložte tento odkaz do vášho prehliadača:</p>
        <p><a href="$jwt_link">$jwt_link</a></p>
        <div class="footer">
            <p>S pozdravom,<br>SSS</p>
        </div>
    </div>
</body>
</html>
