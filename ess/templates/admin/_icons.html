{% macro icon(name, title) %}<img class="icon" src="/static/icons/{{ name }}.png" alt="{{ title }}" title="{{ title }}" width="20" height="20">{% endmacro %}
{% macro legend() %}<p class="legend muted">{% for name, title in ICON_LEGEND %}<span>{{ icon(name, title) }} {{ title }}</span>{% endfor %}</p>{% endmacro %}
