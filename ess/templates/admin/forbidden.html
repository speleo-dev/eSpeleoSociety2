{% extends "admin/_layout.html" %}
{% block body %}
<div class="card">
  <div class="card-body">
    <div class="d-flex align-items-center gap-2 mb-3">
      <i class="ti ti-lock text-warning fs-1" aria-hidden="true"></i>
      <h2 class="card-title mb-0">Nemáte oprávnenie</h2>
    </div>
    <p>{% if admin and admin.is_system_admin %}Túto časť spravuje administrátor (evidencia členov, skupín a členského).
       {% else %}Túto stránku môže otvoriť len superadmin.{% endif %}</p>
    <a class="btn btn-outline-secondary" href="{{ A }}">Prehľad</a>
  </div>
</div>
{% endblock %}
