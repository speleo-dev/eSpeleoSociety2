{% extends "base.html" %}
{% block page_wrapper %}
<div class="page public-app">
  <header class="navbar border-bottom d-print-none">
    <div class="container-tight">
      <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="/">
        <img src="/static/logo-sss.png" alt="" width="32" height="32">
        <span>Slovenská speleologická spoločnosť</span>
      </a>
    </div>
  </header>
  <main class="page-body py-4">
    <div class="container-tight">
      <div class="card">
        <div class="card-body p-3 p-md-4">
          {% block content %}{% endblock %}
        </div>
      </div>
    </div>
  </main>
</div>
{% endblock %}
