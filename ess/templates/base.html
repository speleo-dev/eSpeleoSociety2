<!doctype html>
<html lang="{{ page_lang|default('sk') }}"{% if page_lang %} data-lang="{{ page_lang }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>{% block title %}eSpeleoSociety{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">

  <!-- Theme initialization to avoid theme flash -->
  <script>
    (function() {
      var theme;
      try {
        theme = localStorage.getItem("tabler-theme");
      } catch {
        theme = null;
      }
      if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-bs-theme", "dark");
      } else {
        document.documentElement.setAttribute("data-bs-theme", "light");
      }
    })();
  </script>

  <!-- Tabler Core & Icons CSS -->
  <link rel="stylesheet" href="/static/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/static/vendor/tabler/tabler-icons.min.css">

  <style>
    /* Light mode contrast & surface hierarchy */
    [data-bs-theme="light"] {
      --tblr-body-bg: #eef2f7;
      --tblr-bg-surface: #ffffff;
      --tblr-bg-surface-secondary: #f8fafc;
      --tblr-border-color: #cbd5e1;
      --tblr-border-color-translucent: rgba(15, 23, 42, 0.14);
    }
    [data-bs-theme="light"] .card {
      background-color: #ffffff;
      border-color: #cbd5e1;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    [data-bs-theme="light"] .card-header,
    [data-bs-theme="light"] .card-footer {
      border-color: #e2e8f0;
    }
    [data-bs-theme="light"] .card-footer.bg-surface-secondary,
    [data-bs-theme="light"] .card.bg-surface-secondary {
      background-color: #f8fafc !important;
    }
    [data-bs-theme="light"] header.navbar {
      background-color: #ffffff;
      border-bottom: 1px solid #cbd5e1 !important;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    [data-bs-theme="light"] .table thead th {
      background-color: #f1f5f9;
      color: #334155;
      border-bottom-color: #cbd5e1;
    }
    [data-bs-theme="light"] .table-hover tbody tr:hover {
      background-color: #f1f5f9;
    }

    /* Crisp form controls & unmistakable active/focus states */
    [data-bs-theme="light"] .form-control,
    [data-bs-theme="light"] .form-select {
      background-color: #ffffff;
      border-color: #94a3b8;
      color: #0f172a;
    }
    [data-bs-theme="light"] .form-control:hover:not(:disabled),
    [data-bs-theme="light"] .form-select:hover:not(:disabled) {
      border-color: #64748b;
    }
    .form-control:focus,
    .form-select:focus {
      border-color: #206bc4 !important;
      box-shadow: 0 0 0 0.22rem rgba(32, 107, 196, 0.24) !important;
    }
    [data-bs-theme="light"] .form-control:focus,
    [data-bs-theme="light"] .form-select:focus {
      background-color: #f8fbff;
    }
    [data-bs-theme="dark"] .form-control:focus,
    [data-bs-theme="dark"] .form-select:focus {
      background-color: rgba(32, 107, 196, 0.10);
    }
    [data-bs-theme="light"] fieldset:disabled .form-control,
    [data-bs-theme="light"] fieldset:disabled .form-select,
    [data-bs-theme="light"] .form-control:disabled,
    [data-bs-theme="light"] .form-select:disabled {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
      color: #475569;
    }

    /* Active sidebar navigation highlight */
    .navbar-vertical .navbar-nav .nav-item.active > .nav-link,
    .navbar-vertical .navbar-nav .dropdown-item.active {
      background-color: rgba(255, 255, 255, 0.12);
      border-left: 3px solid #4299e1;
      color: #ffffff;
      font-weight: 600;
    }
    .js-theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 6px;
      border: 1px solid var(--tblr-border-color, #cbd5e1);
    }
    .js-theme-toggle:hover {
      background-color: var(--tblr-bg-surface-secondary, #f1f5f9);
    }
    .navbar .nav-link,
    .navbar .navbar-toggler { min-height: 2.75rem; }
    /* Member status icons preserving exact appearance & size in both themes */
    img.icon {
      width: 20px;
      height: 20px;
      vertical-align: -3px;
      display: inline-block;
      object-fit: contain;
    }
    td.icons {
      white-space: nowrap;
      width: 1%;
    }
    td.logo {
      width: 1%;
      text-align: center;
    }
    img.club-logo {
      max-height: 38px;
      max-width: 80px;
      vertical-align: middle;
      object-fit: contain;
    }
    img.club-logo-large {
      max-height: 160px;
      max-width: 240px;
      border: 1px solid var(--tblr-border-color, #ddd);
      padding: 4px;
      background: var(--tblr-card-bg, #fff);
      border-radius: 4px;
    }

    /* Role badges styling */
    .role-badge { font-weight: 600; }
    .role-chair, .role-delegate { background: #1e8449 !important; color: #fff !important; }
    .role-admin, .role-member { background: #2b5d8a !important; color: #fff !important; }
    .role-system_admin { background: #7d3c98 !important; color: #fff !important; }

    /* Badge indicators */
    .badge-tasks { background-color: #c0392b !important; color: #fff !important; }
    .badge-unpaid { background-color: #b7950b !important; color: #fff !important; }

    /* Flash messages compatibility */
    .flash {
      position: relative;
      padding: .75rem 1rem;
      margin-bottom: 1rem;
      border: 1px solid transparent;
      border-radius: 4px;
    }
    .flash.ok, .flash.success {
      color: var(--tblr-success, #2fb344);
      background-color: var(--tblr-success-subtle, rgba(47, 179, 68, 0.1));
      border-color: var(--tblr-success-border-subtle, rgba(47, 179, 68, 0.2));
    }
    .flash.error, .flash.danger {
      color: var(--tblr-danger, #d63939);
      background-color: var(--tblr-danger-subtle, rgba(214, 57, 57, 0.1));
      border-color: var(--tblr-danger-border-subtle, rgba(214, 57, 57, 0.2));
    }

    /* Compatibility layer for legacy unmigrated pages & portal */
    form.inline { display: inline-block; }
    .form .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .form label:not(.check) {
      display: flex;
      flex-direction: column;
      gap: .35rem;
      color: var(--tblr-secondary, #626976);
      font-size: .875rem;
    }
    .form input:not([type="checkbox"]):not([type="radio"]),
    .form select,
    .form textarea {
      width: 100%;
      min-height: 2.375rem;
      padding: .4375rem .75rem;
      color: var(--tblr-body-color, #182433);
      background-color: var(--tblr-bg-forms, var(--tblr-bg-surface, #fff));
      border: 1px solid var(--tblr-border-color, #dce1e7);
      border-radius: var(--tblr-border-radius, .375rem);
    }
    .form input[type="checkbox"],
    .form input[type="radio"] { accent-color: var(--tblr-primary, #206bc4); }
    .inline input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]),
    .inline select {
      min-height: 2.375rem;
      padding: .4375rem .75rem;
      color: var(--tblr-body-color, #182433);
      background-color: var(--tblr-bg-forms, var(--tblr-bg-surface, #fff));
      border: 1px solid var(--tblr-border-color, #dce1e7);
      border-radius: var(--tblr-border-radius, .375rem);
    }
    .form label.check {
      display: flex;
      align-items: flex-start;
      gap: .6rem;
      margin: .75rem 0;
      color: var(--tblr-body-color, #182433);
    }
    .form label.check input { margin-top: .2rem; }
    .form button:not([class]), button.primary {
      min-height: 2.375rem;
      padding: .4375rem .75rem;
      color: #fff;
      background: var(--tblr-primary, #206bc4);
      border: 1px solid var(--tblr-primary, #206bc4);
      border-radius: var(--tblr-border-radius, .375rem);
      cursor: pointer;
    }
    .inline button:not([class]) {
      min-height: 2.375rem;
      padding: .4375rem .75rem;
      color: var(--tblr-body-color, #182433);
      background: var(--tblr-bg-surface, #fff);
      border: 1px solid var(--tblr-border-color, #cbd5e1);
      border-radius: var(--tblr-border-radius, .375rem);
      cursor: pointer;
    }
    button.link {
      background: none;
      border: 0;
      padding: 0;
      color: var(--tblr-link-color, #206bc4);
      cursor: pointer;
      text-decoration: underline;
    }
    .chip {
      display: inline-block;
      background: var(--tblr-bg-surface-secondary, #eef2f6);
      color: var(--tblr-body-color, #1e293b);
      border-radius: 1rem;
      padding: .1rem .6rem;
      font-size: .85rem;
      margin: 0 .2rem .2rem 0;
      border: 1px solid var(--tblr-border-color-translucent, rgba(98, 105, 118, 0.16));
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem 1.2rem;
      font-size: .85rem;
      margin-top: 1rem;
    }
    .table-wrap {
      overflow-x: auto;
      margin-bottom: 1rem;
    }
    section.box {
      border: 1px solid var(--tblr-border-color, #e6e7e9);
      border-radius: 4px;
      padding: 1rem;
      margin: 1rem 0;
      background-color: var(--tblr-card-bg, #fff);
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }
    p.back {
      margin-bottom: .75rem;
    }
    .member-section-nav {
      position: sticky;
      top: 0;
      z-index: 1020;
      display: flex;
      gap: .25rem;
      overflow-x: auto;
      padding: .5rem 0;
      margin-bottom: 1rem;
      background: var(--tblr-bg-surface, #fff);
      border-bottom: 1px solid var(--tblr-border-color, #dce1e7);
      white-space: nowrap;
    }
    .member-section-nav a {
      min-height: 2.5rem;
      display: inline-flex;
      align-items: center;
      padding: .5rem .75rem;
      border-radius: var(--tblr-border-radius, .375rem);
      color: var(--tblr-body-color, #182433);
      text-decoration: none;
    }
    .member-section-nav a:hover { background: var(--tblr-bg-surface-secondary, #f1f5f9); }
    .member-section { scroll-margin-top: 4rem; }
    .ui-fade-out { opacity: 0; transition: opacity .25s ease; }
    .htmx-indicator { opacity: 0; transition: opacity .2s ease-in; }
    .htmx-request .htmx-indicator,
    .htmx-request.htmx-indicator { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .ui-fade-out { transition: none; }
    }
    .table-card-stack { margin-bottom: 0; }
    @media (max-width: 639.98px) {
      .table-responsive > .table.table-card-stack { width: 100%; min-width: 0; }
      .table-card-stack thead { display: none; }
      .table-card-stack tbody { display: block; }
      .table-card-stack tbody tr {
        display: block;
        margin: .75rem;
        padding: .5rem .75rem;
        border: 1px solid var(--tblr-border-color, #dce1e7);
        border-radius: var(--tblr-border-radius, .375rem);
        box-shadow: 0 1px 3px rgba(24, 36, 51, .08);
      }
      .table-card-stack tbody td {
        display: flex;
        align-items: flex-start;
        gap: .75rem;
        padding: .4rem 0;
        border: 0;
      }
      .table-card-stack tbody td[data-label]::before {
        flex: 0 0 6.25rem;
        color: var(--tblr-secondary, #626976);
        font-weight: 600;
        content: attr(data-label);
      }
      .table-card-stack tbody td[data-label="Požiadavka"],
      .table-card-stack tbody td[data-label="Akcia"] { display: block; }
      .table-card-stack tbody td[data-label="Požiadavka"]::before,
      .table-card-stack tbody td[data-label="Akcia"]::before {
        display: block;
        margin-bottom: .25rem;
      }
      .table-card-stack tbody td[colspan] { display: block; }
      .task-actions { display: flex; flex-direction: column; gap: .5rem; }
      .member-actions {
        display: flex !important;
        flex-direction: column;
        align-items: stretch !important;
        gap: .5rem !important;
      }
      .member-actions form,
      .member-actions .dropdown,
      .member-actions .btn { width: 100%; }
      .member-actions .btn { min-height: 2.5rem; }
      .member-inline-action { width: 100%; }
      .member-inline-action .btn { width: 100%; min-height: 2.5rem; }
    }
    @media (max-width: 575.98px) {
      .task-actions form,
      .task-actions .btn,
      .task-actions .form-control { width: 100%; }
    }

    /* Legacy header and navigation rules for unmigrated portal/public layouts */
    header:not(.navbar) {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem 1rem;
      align-items: center;
      padding: .6rem 1rem;
      border-bottom: 1px solid var(--tblr-border-color, #e6e7e9);
      background: var(--tblr-bg-surface, #fff);
    }
    header:not(.navbar) a {
      color: var(--tblr-body-color, #1c1c1c);
      text-decoration: none;
    }
    header:not(.navbar) .brand {
      font-weight: 600;
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    header:not(.navbar) .brand-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .4rem .6rem;
      margin-right: auto;
      min-width: 0;
    }
    header:not(.navbar) nav.menu {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      align-items: center;
    }
    header:not(.navbar) nav.menu details {
      position: relative;
    }
    header:not(.navbar) nav.menu summary {
      list-style: none;
      cursor: pointer;
      margin: 0;
    }
    header:not(.navbar) nav.menu summary::-webkit-details-marker {
      display: none;
    }
    header:not(.navbar) nav.menu summary::after {
      content: " ▾";
      font-size: .8em;
      color: var(--tblr-secondary, #666);
    }
    header:not(.navbar) nav.menu details > div {
      position: absolute;
      z-index: 1000;
      top: calc(100% + .3rem);
      left: 0;
      min-width: 13rem;
      display: flex;
      flex-direction: column;
      background: var(--tblr-bg-surface, #fff);
      border: 1px solid var(--tblr-border-color, #ddd);
      border-radius: .4rem;
      padding: .3rem 0;
      box-shadow: var(--tblr-box-shadow-dropdown, 0 4px 12px rgba(0,0,0,.15));
    }
    header:not(.navbar) nav.menu details > div a {
      padding: .35rem .8rem;
    }
    header:not(.navbar) nav.menu details > div a:hover {
      background: var(--tblr-bg-surface-secondary, #eef2f6);
    }
    header:not(.navbar) nav.menu details.user > div {
      left: auto;
      right: 0;
      min-width: 10rem;
      padding: .4rem .8rem;
      gap: .4rem;
    }
    header:not(.navbar) nav.menu details.user summary::after {
      content: "";
    }
    header:not(.navbar) nav.menu details.user summary {
      display: inline-block;
      padding: .2rem .7rem;
      color: #fff;
      border-radius: .6rem;
    }
    .menu-toggle {
      display: none;
      background: none;
      border: 1px solid var(--tblr-border-color, #ddd);
      border-radius: .4rem;
      font-size: 1.3rem;
      line-height: 1;
      padding: .25rem .55rem;
      color: var(--tblr-body-color, #1c1c1c);
      cursor: pointer;
    }
    @media (max-width: 760px) {
      .menu-toggle { display: block; }
      header:not(.navbar) { padding: .5rem .75rem; }
      header:not(.navbar) .brand-wrap { flex-wrap: nowrap; gap: .3rem; flex: 1 1 0; }
      header:not(.navbar) .brand-wrap .brand { font-size: .95rem; gap: .35rem; white-space: nowrap; }
      header:not(.navbar) .brand-wrap .brand img { width: 28px; height: 28px; }
      header:not(.navbar) nav.menu { display: none; width: 100%; flex-direction: column; align-items: stretch; gap: .2rem; }
      header:not(.navbar).open nav.menu { display: flex; }
      header:not(.navbar) nav.menu > a, header:not(.navbar) nav.menu > details > summary { padding: .45rem .2rem; border-top: 1px solid var(--tblr-border-color, #ddd); }
      header:not(.navbar) nav.menu details > div { position: static; min-width: 0; border: 0; box-shadow: none; padding: 0 0 .3rem 1rem; }
      header:not(.navbar) nav.menu details.user > div { padding: .3rem 0 .3rem 1rem; }
      header:not(.navbar) nav.menu details.user summary { margin-top: .4rem; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block page_wrapper %}
    {% block header %}{% endblock %}
    <main class="page-body">
      <div class="container-xl">
        {% block content %}{% endblock %}
      </div>
    </main>
  {% endblock %}

  <!-- Tabler Core JS -->
  <script src="/static/vendor/tabler/js/tabler.min.js"></script>
  <script src="/static/vendor/htmx/htmx.min.js" defer></script>
  <script src="/static/ui.js" defer></script>

  <!-- Legacy hamburger toggle & Theme Toggle helper script -->
  <script>
    // Hamburger menu on phones for legacy unmigrated headers
    document.querySelectorAll(".menu-toggle").forEach(function(b) {
      b.addEventListener("click", function() {
        var header = b.closest("header");
        if (header) {
          var open = header.classList.toggle("open");
          b.setAttribute("aria-expanded", open ? "true" : "false");
        }
      });
    });

    function toggleTheme() {
      var current = document.documentElement.getAttribute("data-bs-theme") || "light";
      var next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-bs-theme", next);
      try {
        localStorage.setItem("tabler-theme", next);
      } catch {
        // The current page still changes theme when storage is unavailable.
      }
      updateThemeToggleIcons(next);
    }
    function updateThemeToggleIcons(theme) {
      document.querySelectorAll(".theme-toggle-icon-dark").forEach(function(el) {
        el.style.display = theme === "dark" ? "none" : "inline-block";
      });
      document.querySelectorAll(".theme-toggle-icon-light").forEach(function(el) {
        el.style.display = theme === "dark" ? "inline-block" : "none";
      });
    }
    document.addEventListener("DOMContentLoaded", function() {
      var current = document.documentElement.getAttribute("data-bs-theme") || "light";
      updateThemeToggleIcons(current);
      document.querySelectorAll(".js-theme-toggle").forEach(function(btn) {
        btn.addEventListener("click", function(e) {
          e.preventDefault();
          toggleTheme();
        });
      });
    });
  </script>
</body>
</html>
