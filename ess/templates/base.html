<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}eSpeleoSociety{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <style>
    :root { color-scheme: light dark; --fg:#1c1c1c; --bg:#fff; --muted:#666; --line:#ddd; --accent:#2b5d8a;
            --ok:#e6f4ea; --err:#fdecea; --chip:#eef2f6; font-family: system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e8e8e8; --bg:#161616; --muted:#9a9a9a; --line:#333;
            --accent:#7fb2e5; --ok:#1d3a25; --err:#4a1f1b; --chip:#23303c; } }
    body { margin:0; background:var(--bg); color:var(--fg); line-height:1.45; }
    header { display:flex; flex-wrap:wrap; gap:.5rem 1rem; align-items:center; padding:.6rem 1rem; border-bottom:1px solid var(--line); }
    header .brand { font-weight:600; margin-right:auto; }
    header a { color:var(--fg); text-decoration:none; }
    header nav { display:flex; flex-wrap:wrap; gap:.75rem; }
    main { max-width:72rem; margin:0 auto; padding:1rem; }
    a { color:var(--accent); }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:.4rem .5rem; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-weight:600; font-size:.9rem; color:var(--muted); }
    .table-wrap { overflow-x:auto; }
    .chip { display:inline-block; background:var(--chip); border-radius:1rem; padding:.05rem .55rem; font-size:.85rem; margin:0 .2rem .2rem 0; }
    .muted { color:var(--muted); }
    .flash { padding:.6rem .8rem; border-radius:.4rem; margin-bottom:1rem; }
    .flash.ok { background:var(--ok); } .flash.error { background:var(--err); }
    .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(12rem, 1fr)); gap:1rem; }
    .card { border:1px solid var(--line); border-radius:.5rem; padding:1rem; }
    .card .num { font-size:2rem; font-weight:600; }
    form.inline { display:inline; }
    button, input, select { font:inherit; }
    button { cursor:pointer; padding:.25rem .7rem; border:1px solid var(--line); border-radius:.35rem; background:var(--chip); color:var(--fg); }
    button.primary { background:var(--accent); color:var(--bg); border-color:var(--accent); }
    .filters { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1rem; }
    dl { display:grid; grid-template-columns:max-content 1fr; gap:.3rem 1rem; }
    dt { color:var(--muted); }
    img.icon { width:20px; height:20px; vertical-align:-4px; }
    header .brand { display:flex; align-items:center; gap:.5rem; }
    header .brand img { border-radius:50%; }
    .legend { display:flex; flex-wrap:wrap; gap:.3rem 1rem; font-size:.85rem; margin-top:1rem; }
    img.club-logo { max-height:48px; max-width:96px; vertical-align:middle; }
    img.club-logo-large { max-height:160px; max-width:240px; border:1px solid #ddd; padding:4px; background:#fff; }
    .form .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(14rem, 1fr)); gap:.75rem 1rem; margin-bottom:.75rem; }
    .form label { display:flex; flex-direction:column; gap:.2rem; font-size:.9rem; color:var(--muted); }
    .form label.check { flex-direction:row; align-items:center; gap:.4rem; color:var(--fg); margin:.4rem 0; }
    .form input, .form select { padding:.35rem .5rem; border:1px solid var(--line); border-radius:.35rem; background:var(--bg); color:var(--fg); }
    section.box { border:1px solid var(--line); border-radius:.5rem; padding:.75rem 1rem; margin:1rem 0; }
    details summary { cursor:pointer; color:var(--accent); margin:.5rem 0; }
    dd { margin:0; min-width:0; overflow-wrap:anywhere; }
    td form.inline button { margin:0 .2rem .2rem 0; white-space:nowrap; }
    nav.menu { align-items:center; }
    nav.menu details { position:relative; }
    nav.menu summary { list-style:none; cursor:pointer; color:var(--fg); margin:0; }
    nav.menu summary::-webkit-details-marker { display:none; }
    nav.menu summary::after { content:" ▾"; font-size:.8em; color:var(--muted); }
    nav.menu details > div { position:absolute; z-index:10; top:1.6rem; left:0; min-width:13rem; display:flex; flex-direction:column;
      background:var(--bg); border:1px solid var(--line); border-radius:.4rem; padding:.3rem 0; box-shadow:0 4px 12px rgba(0,0,0,.15); }
    nav.menu details > div a { padding:.35rem .8rem; }
    nav.menu details > div a:hover { background:var(--chip); }
    .badge { display:inline-block; min-width:1.6rem; text-align:center; border-radius:1rem; padding:.05rem .5rem; font-size:.85rem;
      font-weight:600; color:#fff !important; }
    .badge-tasks { background:#c0392b; } .badge-unpaid { background:#d68910; }
    .role { border-radius:1rem; padding:.05rem .6rem; font-size:.8rem; color:#fff; white-space:nowrap; }
    .role-admin { background:#2b5d8a; } .role-system_admin { background:#7d3c98; }
    p.back { margin:0 0 .5rem; font-size:.9rem; }
    @media (max-width: 640px) {
      table.stack thead { display:none; }
      table.stack tr { display:block; border-bottom:1px solid var(--line); padding:.4rem 0; }
      table.stack td { display:block; border:0; padding:.15rem 0; }
      table.stack td[data-label]::before { content:attr(data-label) ": "; color:var(--muted); }
    }
  </style>
</head>
<body>
  {% block header %}{% endblock %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
