<!doctype html>
<html lang="{{ page_lang|default('sk') }}"{% if page_lang %} data-lang="{{ page_lang }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>{% block title %}eSpeleoSociety{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">

  <!-- Theme initialization to avoid theme flash -->
  <script>
    (function() {
      var theme = localStorage.getItem("tabler-theme");
      if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-bs-theme", "dark");
      } else {
        document.documentElement.setAttribute("data-bs-theme", "light");
      }
    })();
  </script>

  <!-- Tabler Core & Icons CSS -->
  <link rel="stylesheet" href="/static/vendor/tabler/css/tabler.min.css">
  <link rel="stylesheet" href="/static/vendor/tabler/css/tabler-icons.min.css">

  <style>
    /* Member status icons preserving exact appearance & size in both themes */
    img.icon {
      width: 20px;
      height: 20px;
      vertical-align: -3px;
      display: inline-block;
      object-fit: contain;
    }
    td.icons {
      white-space: nowrap;
      width: 1%;
    }
    td.logo {
      width: 1%;
      text-align: center;
    }
    img.club-logo {
      max-height: 38px;
      max-width: 80px;
      vertical-align: middle;
      object-fit: contain;
    }
    img.club-logo-large {
      max-height: 160px;
      max-width: 240px;
      border: 1px solid var(--tblr-border-color, #ddd);
      padding: 4px;
      background: var(--tblr-card-bg, #fff);
      border-radius: 4px;
    }

    /* Role badges styling */
    .role-badge { font-weight: 600; }
    .role-chair, .role-delegate { background: #1e8449 !important; color: #fff !important; }
    .role-admin, .role-member { background: #2b5d8a !important; color: #fff !important; }
    .role-system_admin { background: #7d3c98 !important; color: #fff !important; }

    /* Badge indicators */
    .badge-tasks { background-color: #c0392b !important; color: #fff !important; }
    .badge-unpaid { background-color: #b7950b !important; color: #fff !important; }

    /* Flash messages compatibility */
    .flash {
      position: relative;
      padding: .75rem 1rem;
      margin-bottom: 1rem;
      border: 1px solid transparent;
      border-radius: 4px;
    }
    .flash.ok, .flash.success {
      color: var(--tblr-success, #2fb344);
      background-color: var(--tblr-success-subtle, rgba(47, 179, 68, 0.1));
      border-color: var(--tblr-success-border-subtle, rgba(47, 179, 68, 0.2));
    }
    .flash.error, .flash.danger {
      color: var(--tblr-danger, #d63939);
      background-color: var(--tblr-danger-subtle, rgba(214, 57, 57, 0.1));
      border-color: var(--tblr-danger-border-subtle, rgba(214, 57, 57, 0.2));
    }

    /* Compatibility layer for legacy unmigrated pages & portal */
    form.inline { display: inline-block; }
    button.link {
      background: none;
      border: 0;
      padding: 0;
      color: var(--tblr-link-color, #206bc4);
      cursor: pointer;
      text-decoration: underline;
    }
    .chip {
      display: inline-block;
      background: var(--tblr-bg-surface-secondary, #eef2f6);
      color: var(--tblr-body-color, #1e293b);
      border-radius: 1rem;
      padding: .1rem .6rem;
      font-size: .85rem;
      margin: 0 .2rem .2rem 0;
      border: 1px solid var(--tblr-border-color-translucent, rgba(98, 105, 118, 0.16));
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem 1.2rem;
      font-size: .85rem;
      margin-top: 1rem;
    }
    .table-wrap {
      overflow-x: auto;
      margin-bottom: 1rem;
    }
    section.box {
      border: 1px solid var(--tblr-border-color, #e6e7e9);
      border-radius: 4px;
      padding: 1rem;
      margin: 1rem 0;
      background-color: var(--tblr-card-bg, #fff);
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }
    p.back {
      margin-bottom: .75rem;
    }

    /* Legacy header and navigation rules for unmigrated portal/public layouts */
    header:not(.navbar) {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem 1rem;
      align-items: center;
      padding: .6rem 1rem;
      border-bottom: 1px solid var(--tblr-border-color, #e6e7e9);
      background: var(--tblr-bg-surface, #fff);
    }
    header:not(.navbar) a {
      color: var(--tblr-body-color, #1c1c1c);
      text-decoration: none;
    }
    header:not(.navbar) .brand {
      font-weight: 600;
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    header:not(.navbar) .brand-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .4rem .6rem;
      margin-right: auto;
      min-width: 0;
    }
    header:not(.navbar) nav.menu {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      align-items: center;
    }
    header:not(.navbar) nav.menu details {
      position: relative;
    }
    header:not(.navbar) nav.menu summary {
      list-style: none;
      cursor: pointer;
      margin: 0;
    }
    header:not(.navbar) nav.menu summary::-webkit-details-marker {
      display: none;
    }
    header:not(.navbar) nav.menu summary::after {
      content: " ▾";
      font-size: .8em;
      color: var(--tblr-secondary, #666);
    }
    header:not(.navbar) nav.menu details > div {
      position: absolute;
      z-index: 1000;
      top: calc(100% + .3rem);
      left: 0;
      min-width: 13rem;
      display: flex;
      flex-direction: column;
      background: var(--tblr-bg-surface, #fff);
      border: 1px solid var(--tblr-border-color, #ddd);
      border-radius: .4rem;
      padding: .3rem 0;
      box-shadow: var(--tblr-box-shadow-dropdown, 0 4px 12px rgba(0,0,0,.15));
    }
    header:not(.navbar) nav.menu details > div a {
      padding: .35rem .8rem;
    }
    header:not(.navbar) nav.menu details > div a:hover {
      background: var(--tblr-bg-surface-secondary, #eef2f6);
    }
    header:not(.navbar) nav.menu details.user > div {
      left: auto;
      right: 0;
      min-width: 10rem;
      padding: .4rem .8rem;
      gap: .4rem;
    }
    header:not(.navbar) nav.menu details.user summary::after {
      content: "";
    }
    header:not(.navbar) nav.menu details.user summary {
      display: inline-block;
      padding: .2rem .7rem;
      color: #fff;
      border-radius: .6rem;
    }
    .menu-toggle {
      display: none;
      background: none;
      border: 1px solid var(--tblr-border-color, #ddd);
      border-radius: .4rem;
      font-size: 1.3rem;
      line-height: 1;
      padding: .25rem .55rem;
      color: var(--tblr-body-color, #1c1c1c);
      cursor: pointer;
    }
    @media (max-width: 760px) {
      .menu-toggle { display: block; }
      header:not(.navbar) { padding: .5rem .75rem; }
      header:not(.navbar) .brand-wrap { flex-wrap: nowrap; gap: .3rem; flex: 1 1 0; }
      header:not(.navbar) .brand-wrap .brand { font-size: .95rem; gap: .35rem; white-space: nowrap; }
      header:not(.navbar) .brand-wrap .brand img { width: 28px; height: 28px; }
      header:not(.navbar) nav.menu { display: none; width: 100%; flex-direction: column; align-items: stretch; gap: .2rem; }
      header:not(.navbar).open nav.menu { display: flex; }
      header:not(.navbar) nav.menu > a, header:not(.navbar) nav.menu > details > summary { padding: .45rem .2rem; border-top: 1px solid var(--tblr-border-color, #ddd); }
      header:not(.navbar) nav.menu details > div { position: static; min-width: 0; border: 0; box-shadow: none; padding: 0 0 .3rem 1rem; }
      header:not(.navbar) nav.menu details.user > div { padding: .3rem 0 .3rem 1rem; }
      header:not(.navbar) nav.menu details.user summary { margin-top: .4rem; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block page_wrapper %}
    {% block header %}{% endblock %}
    <main class="page-body">
      <div class="container-xl">
        {% block content %}{% endblock %}
      </div>
    </main>
  {% endblock %}

  <!-- Tabler Core JS -->
  <script src="/static/vendor/tabler/js/tabler.min.js"></script>

  <!-- Legacy hamburger toggle & Theme Toggle helper script -->
  <script>
    // Hamburger menu on phones for legacy unmigrated headers
    document.querySelectorAll(".menu-toggle").forEach(function(b) {
      b.addEventListener("click", function() {
        var header = b.closest("header");
        if (header) {
          var open = header.classList.toggle("open");
          b.setAttribute("aria-expanded", open ? "true" : "false");
        }
      });
    });

    function toggleTheme() {
      var current = document.documentElement.getAttribute("data-bs-theme") || "light";
      var next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-bs-theme", next);
      localStorage.setItem("tabler-theme", next);
      updateThemeToggleIcons(next);
    }
    function updateThemeToggleIcons(theme) {
      document.querySelectorAll(".theme-toggle-icon-dark").forEach(function(el) {
        el.style.display = theme === "dark" ? "none" : "inline-block";
      });
      document.querySelectorAll(".theme-toggle-icon-light").forEach(function(el) {
        el.style.display = theme === "dark" ? "inline-block" : "none";
      });
    }
    document.addEventListener("DOMContentLoaded", function() {
      var current = document.documentElement.getAttribute("data-bs-theme") || "light";
      updateThemeToggleIcons(current);
      document.querySelectorAll(".js-theme-toggle").forEach(function(btn) {
        btn.addEventListener("click", function(e) {
          e.preventDefault();
          toggleTheme();
        });
      });
    });
  </script>
</body>
</html>
