{% extends "portal/_layout.html" %}
{% block title %}Údaje skupiny – {{ club.name }}{% endblock %}
{% block portal %}
<h1>Údaje skupiny {{ club.name }}</h1>
{% if error %}<div class="flash error">{{ error }}</div>{% endif %}
<form method="post" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <div class="grid">
    <label>Ulica a číslo<input name="street" value="{{ raw.street or '' }}"></label>
    <label>PSČ<input name="postal_code" value="{{ raw.postal_code or '' }}"></label>
    <label>Obec / mesto<input name="city" value="{{ raw.city or '' }}"></label>
    <label>Krajina (kód)<input name="country" maxlength="2" pattern="[A-Za-z]{2}" value="{{ raw.country or 'SK' }}"></label>
    <label>E-mail<input type="email" name="email" value="{{ raw.email or '' }}"></label>
    <label>Telefón<input type="tel" name="phone" value="{{ raw.phone or '' }}"></label>
    <label>Web<input type="url" name="web" value="{{ raw.web or '' }}" placeholder="https://"></label>
    <label>Dátum založenia<input type="date" name="founded_on" value="{{ raw.founded_on or '' }}"></label>
  </div>
  <p class="muted">Názov, kód a logo skupiny mení administrátor SSS.</p>
  <p><button class="primary">Uložiť</button> <a href="/portal/clubs/{{ club.id }}">Zrušiť</a></p>
</form>
{% endblock %}
