name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: ess
          POSTGRES_PASSWORD: ess
          POSTGRES_DB: ess_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ess" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ESS_TEST_DATABASE_URL: postgresql://ess:ess@localhost:5432/ess_test
      ESS_DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
