[project]
name = "ess"
version = "0.1.0"
description = "eSpeleoSociety - information system of the Slovak Speleological Society"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "cryptography>=44",
    "authlib>=1.3",
    "itsdangerous>=2.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=11",
    "google-cloud-storage>=2.18",
    "tzdata",
    "reportlab>=4",
    "qrcode>=7.4",
    "defusedxml>=0.7",  # bank statements (camt.053 XML) are untrusted input
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ess*"]

[tool.setuptools.package-data]
ess = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: tests that need a PostgreSQL database (ESS_TEST_DATABASE_URL)"]
